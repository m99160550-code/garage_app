name: tdc_garage
description: "TDC-mena Garage: vehicle health, mileage and maintenance tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/core/l10n/arb (see l10n.yaml).
  generate: true

  fonts:
    # Latin UI text (design spec 1.3).
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    # Inter's display optical size, used from 32 pt upwards.
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/inter/InterDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/InterDisplay-Bold.ttf
          weight: 700
    # Arabic UI text.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
